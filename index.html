<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sitzplan Hochzeit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= WELCOME SCREEN ================= -->
  <div id="welcome">
    <div class="welcome-box">
      <div class="ring-icon">💍</div>
      <h2>Herzlich Willkommen</h2>
      <h3>Finde deinen Sitzplatz</h3>

      <div class="search-container">
        <input 
          type="text" 
          id="guest-search" 
          placeholder="Vor- oder Nachname eingeben..." 
          autocomplete="off"
        >
        <button type="button" onclick="starteSuche()">Suchen</button>
      </div>

      <button type="button" class="btn-secondary" onclick="zeigSaalplan()">
        Gesamten Saalplan anzeigen
      </button>
    </div>
  </div>


  <!-- ================= SAALPLAN OVERLAY ================= -->
  <div id="overlay" class="hidden">
    <div id="saalplan">

      <!-- BRAUTTISCH BEREICH -->
      <div id="brautbereich">
        <div id="brauttisch">
          <div class="braut-platte">
            <span>Brauttisch</span>
            <span class="tisch-tag">Haupttisch</span>
          </div>
          <div class="braut-reihe">
            <!-- Dynamisch befüllt durch app.js -->
          </div>
        </div>
      </div>

      <!-- TISCH REIHEN (Container wird von app.js befüllt) -->
      <div id="tische">
        <!-- 
          HINWEIS: Falls du deine Tische statisch im HTML pflegst (ohne data.json),
          sieht die Struktur für Reihe 3 wie folgt aus:

          <div class="tisch-reihe">
            <div class="tisch-box">... Tisch 8 ...</div>
            <div class="tisch-box">... Tisch 9 ...</div>
            <div class="tisch-box">... Tisch 10 ...</div>
            <div class="tisch-box">... Tisch 11 ...</div>
            <div class="tisch-box">... Tisch 12 ...</div>
            <div class="buffet-box">➔<br>Ausschank & Buffet</div>
          </div>
        -->
      </div>

      <!-- UNTERER SAALBEREICH (Eingang & DJ) -->
      <div class="saal-unten">
        <div class="eingang">🚪 Eingang</div>
        <div class="dj">🎧 DJ & Tanzfläche</div>
      </div>

    </div>
  </div>


  <!-- ================= FLOATING BUTTONS ================= -->
  <button type="button" class="floating-btn btn-secondary" onclick="zeigWelcome()">
    🔍 Neue Suche
  </button>

  <button type="button" class="admin-trigger" onclick="toggleAdminModal(true)">
    ⚙️ Admin
  </button>


  <!-- ================= ADMIN MODAL ================= -->
  <div id="admin-modal" class="modal hidden">
    <div class="glass-card">
      <div class="modal-header">
        <h3>Admin Verwaltung</h3>
        <span class="close-btn" onclick="toggleAdminModal(false)">&times;</span>
      </div>

      <div class="admin-tabs">
        <button type="button" class="tab-btn active" onclick="switchAdminTab('gaeste')">Gästeliste</button>
        <button type="button" class="tab-btn" onclick="switchAdminTab('tische')">Tische</button>
      </div>

      <div id="tab-gaeste" class="admin-tab-content">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Tisch</th>
                <th>Sitz</th>
              </tr>
            </thead>
            <tbody id="admin-gaeste-tbody">
              <!-- Dynamisch via admin.js -->
            </tbody>
          </table>
        </div>
      </div>

      <div id="tab-tische" class="admin-tab-content hidden">
        <p style="font-size: 13px; color: #666;">Tischverwaltung und Kapazitäten.</p>
      </div>
    </div>
  </div>


  <!-- ================= SCRIPTS ================= -->
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
